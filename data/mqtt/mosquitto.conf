# TLS 8883 only. Certs are generated by prepare.sh into data/mqtt/certs/ (not committed).
# To add plaintext 1883 for lab only, append:
#   listener 1883
# and set ANX_MQTT_INSECURE=1 on clients.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
require_certificate false
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
