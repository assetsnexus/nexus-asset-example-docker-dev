# On-device Edge AI — anx-inference sidecar (asset_edge mode).
#
# Included by ./up.sh (COMPOSE_FILE + inference profile). No manual env edits.
#
# Requires COMPOSE_PROFILES to include registry-db (Mongo + Redis) and inference.
# GPU: uncomment deploy.resources and use an NVIDIA host + nvidia-container-toolkit.
# Host camera/mic for live_interface labs: copy docker-compose.override.inference.example.yml
# to docker-compose.override.yml (gitignored) and adjust device binds.

services:
  anx-inference:
    image: ${ANX_INFERENCE_IMAGE:-eu1.dockerreg.sdk.assetsnexus.org/nexus/inference/anx.inference.backend}:${ANX_INFERENCE_TAG:-0.1.3}
    container_name: anx-ipc-inference
    restart: unless-stopped
    profiles: ["inference"]
    env_file:
      - .env.inference
    environment:
      - NODE_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=${ANX_INFERENCE_PORT:-3055}
      - ANX_INFERENCE_MODE=asset_edge
      - ANX_ASSETS_NODE_URL=http://anx-assets-node:${SERVER_PORT:-28480}
      - ANX_EDGE_LOCAL_TOKEN_FILE=/edge/local-trust.token
    volumes:
      - ./data/edge:/edge:ro
    networks:
      - default
    ports:
      - "${ANX_INFERENCE_PORT:-3055}:${ANX_INFERENCE_PORT:-3055}"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      anx-assets-node:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=process.env.APP_PORT||'3055';require('http').get('http://127.0.0.1:'+p+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: anx-ipc-minio
    restart: unless-stopped
    profiles: ["inference"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-anx}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD via ./up.sh}
      MC_HOST_local: http://${MINIO_ROOT_USER:-anx}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000
    volumes:
      - ./volumes/minio:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-39000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-39001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: anx-ipc-minio-init
    profiles: ["inference"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-anx}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD via ./up.sh}
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/inference
