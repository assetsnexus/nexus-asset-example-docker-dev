# On-device Edge AI — anx-inference sidecar (asset_edge mode).
#
# Full setup (default when you want agents on the IPC):
#   ./prepare.sh --with-inference
#   docker compose -f docker-compose.yml -f docker-compose.inference.yml up -d
#
# Requires COMPOSE_PROFILES to include registry-db (Mongo + Redis) and inference.
# GPU: uncomment deploy.resources and use an NVIDIA host + nvidia-container-toolkit.
# Host camera/mic for live_interface labs: copy docker-compose.override.inference.example.yml
# to docker-compose.override.yml (gitignored) and adjust device binds.

services:
  anx-inference:
    image: ${ANX_INFERENCE_IMAGE:-eu1.dockerreg.sdk.assetsnexus.org/anx-inference-backend}:${ANX_INFERENCE_TAG:-latest}
    container_name: anx-ipc-inference
    restart: unless-stopped
    profiles: ["inference"]
    env_file:
      - .env.inference
    environment:
      - NODE_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=${ANX_INFERENCE_PORT:-3055}
      - ANX_INFERENCE_MODE=asset_edge
      - ANX_ASSETS_NODE_URL=http://anx-assets-node:8080
      - ANX_EDGE_LOCAL_TOKEN_FILE=/edge/local-trust.token
    volumes:
      - ./data/edge:/edge:ro
    networks:
      - default
    ports:
      - "${ANX_INFERENCE_PORT:-3055}:${ANX_INFERENCE_PORT:-3055}"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      anx-assets-node:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=process.env.APP_PORT||'3055';require('http').get('http://127.0.0.1:'+p+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
